# Local development services. Start with `npm run db:up`.
services:
  qdrant:
    # Keep in sync with the service container in .github/workflows/ci.yml.
    image: qdrant/qdrant:v1.20.2
    ports:
      - "6333:6333" # REST API and dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships without curl; probe the port with bash instead.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  qdrant_storage:
