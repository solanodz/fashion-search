# Source of truth for repository labels, synced by .github/workflows/labels.yml.
# Labels not listed here are removed on sync.

- name: "type:feature"
  color: "1d76db"
  description: "New user-facing capability"
- name: "type:bug"
  color: "d73a4a"
  description: "Something does not work as expected"
- name: "type:chore"
  color: "c5def5"
  description: "Tooling, config or maintenance"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:test"
  color: "bfd4f2"
  description: "Tests only"
- name: "type:ci"
  color: "5319e7"
  description: "CI/CD pipelines and automation"
- name: "type:refactor"
  color: "fbca04"
  description: "Code change without behavior change"
- name: "type:perf"
  color: "f9d0c4"
  description: "Performance improvement"

- name: "area:search"
  color: "0e8a16"
  description: "Query encoding, vector search and filters"
- name: "area:indexing"
  color: "006b75"
  description: "Dataset ingestion and catalog embeddings"
- name: "area:ui"
  color: "e99695"
  description: "Pages and components"
- name: "area:infra"
  color: "5319e7"
  description: "Docker, deploy, CI and repository config"
- name: "area:docs"
  color: "0075ca"
  description: "README, ADRs and contributor docs"

- name: "priority:high"
  color: "b60205"
  description: "Do next"
- name: "priority:medium"
  color: "fbca04"
  description: "Planned"
- name: "priority:low"
  color: "c2e0c6"
  description: "Nice to have"

- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
- name: "security"
  color: "b60205"
  description: "Security fix or hardening"
- name: "good first issue"
  color: "7057ff"
  description: "Small and well scoped"
